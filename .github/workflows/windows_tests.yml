name: 巢狀短TEMP容器診斷

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOPROXY: "off"
  GOFLAGS: "-mod=vendor"
  CGO_ENABLED: "0"

jobs:
  docker-tests:
    name: docker-tests
    runs-on: windows-2022
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: 取得容器測試來源
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: 準備固定 Go 工具鏈
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - name: 確認真實 Windows Docker 能力
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\docker.ps1','-Action','doctor','-Isolation','process')
      - name: 建置並在 Windows 容器執行全部隔離測試
        run: |
          . .\script\test\ci_tasks.ps1
          Invoke-CINative -File powershell.exe -Arguments @('-NoProfile','-ExecutionPolicy','Bypass','-File','.\script\docker\docker.ps1','-Action','test','-Isolation','process','-ReportDirectory',(Join-Path $env:RUNNER_TEMP 'windows-container-results'))
      - name: 證明真實容器失敗會保留非零退出碼
        run: |
          . .\script\docker\library.ps1
          . .\script\test\ci_tasks.ps1
          $context = Get-ContainerContext -Root $env:GITHUB_WORKSPACE -ReportDirectory (Join-Path $env:RUNNER_TEMP 'failure-probe-unused') -Isolation process
          Assert-CIDockerFailure -Image $context.Image
      - name: 驗證容器真實報告與來源
        if: always()
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $public = Join-Path $env:RUNNER_TEMP 'windows-container-results/public'
          . .\script\test\ci_tasks.ps1
          Assert-CIContainerReport -Directory $public
          Invoke-CINative -File go.exe -Arguments @('run','./script/test/requirements_gate','--artifact-dir',$public,'--source-root','.','--expected-sha',$env:EXPECTED_SHA,'--expected-run-url',$env:EXPECTED_RUN_URL)
      - name: 僅保留容器去識別報告七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-container-results/public/
          retention-days: 7
          if-no-files-found: error

