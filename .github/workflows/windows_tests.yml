name: Windows 測試
on: workflow_dispatch
permissions:
  contents: read
jobs:
  configuration-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 12
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 279f9e7b557310a5aa6108f07e366ec21ae018a4
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: '10.0.300'
          cache: false
      - name: Prepare original workflow tool environment
        run: |
          . .\script\docker\install_managed_tools.ps1
          $artifact = Get-ContainerWorkflowLintArtifact
          $directory = Join-Path $env:RUNNER_TEMP 'actionlint-1.7.12'
          Install-ContainerToolArtifact -Artifact $artifact -Destination $directory -ArchiveDirectory (Join-Path $env:RUNNER_TEMP 'actionlint-download')
          "WINDOWS_SETUP_ACTIONLINT=$(Join-Path $directory 'actionlint.exe')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Reproduce original audit suite under full canonical coverage
        run: |
          $ErrorActionPreference='Stop'
          [Console]::OutputEncoding=[Text.UTF8Encoding]::new($false)
          $source=$PWD.Path
          $head=(& git rev-parse HEAD).Trim()
          if($head -ne '279f9e7b557310a5aa6108f07e366ec21ae018a4'){throw 'Unexpected source'}
          $folder=Join-Path $env:RUNNER_TEMP 'configuration-diagnostic'
          [void][IO.Directory]::CreateDirectory($folder)
          $path=Join-Path $folder 'manifest.json'
          .\test\powershell\coverage\create_baseline_manifest.ps1 -SourceRoot $source -OutputPath $path
          $manifest=Get-Content $path -Raw -Encoding UTF8|ConvertFrom-Json
          $case='test/powershell/integration/audit_runtime_tests.ps1'
          $globalIndex=[Array]::IndexOf([string[]]$manifest.Tests,$case)
          if($globalIndex -lt 0 -or $globalIndex%4 -ne 2){throw 'Unexpected canonical case'}
          $manifest.Tests=@($case)
          $manifest.TestEngines=[pscustomobject]@{}
          $manifest|Add-Member ShardContext ([pscustomobject]@{Commit=$head;RunUrl='https://github.com/ycpss91255/windows_setup/actions/runs/42512829236';RunAttempt=1;ShardIndex=2;ShardCount=4;GlobalIndices=@($globalIndex)})
          [IO.File]::WriteAllText($path,($manifest|ConvertTo-Json -Depth 8),[Text.UTF8Encoding]::new($false))
          $nativeSid=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $kind=if($nativeSid -eq 'S-1-5-18'){'System'}elseif($nativeSid -match '-500$'){'BuiltinAdministrator'}else{'StandardAccount'}
          Write-Host ('NativeIdentityKind='+$kind+';SourceCommit='+$head+';Sources='+$manifest.Sources.Count)
          $proof=Join-Path $folder 'proof'
          $old=$ErrorActionPreference
          try{$ErrorActionPreference='Continue';& powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\script\test\powershell_coverage.ps1 -ManifestPath $path -OutputDirectory $proof -ThrottleLimit 1 *> (Join-Path $folder 'collector.private.log');$code=$LASTEXITCODE}finally{$ErrorActionPreference=$old}
          foreach($workerIndex in @(0)){
            Write-Host ('DiagnosticWorkerIndex='+$workerIndex)
            $stdout=Join-Path $proof ('worker_'+$workerIndex+'.private.stdout.log')
          $stderr=Join-Path $proof ('worker_'+$workerIndex+'.private.stderr.log')
          if(Test-Path $stdout){
            $markers=@(foreach($line in Get-Content $stdout -Encoding UTF8){$pos=$line.IndexOf('@@ASSERT@@');if($pos -ge 0){try{$item=$line.Substring($pos+10)|ConvertFrom-Json;if($item.Name -is [string] -and $item.Passed -is [bool]){$name=$item.Name;if($name.Length -gt 300 -or $name -match '[A-Za-z]:[\\/]|https?://|\\\\|[\r\n]'){$name='RedactedAssertionName'};[pscustomobject]@{Name=$name;Passed=$item.Passed}}}catch{}}})
            foreach($marker in @($markers|Select-Object -Last 15)){Write-Host ('DIAG_ASSERT '+($marker|ConvertTo-Json -Compress))}
            Write-Host ('Assertions='+$markers.Count+';Failed='+@($markers|Where-Object {-not $_.Passed}).Count)
          }
          if(Test-Path $stderr){
            foreach($line in Get-Content $stderr -Encoding UTF8){if($line -match '^At (.+\.ps1):(\d+) char:(\d+)'){$file=[IO.Path]::GetFileName($matches[1]);Write-Host ('DIAG_LOCATION '+(@{File=$file;Line=[int]$matches[2];Column=[int]$matches[3]}|ConvertTo-Json -Compress))}}
          }
          }
          $privateText=''
          foreach($file in @($stdout,$stderr)){if(Test-Path $file){$privateText+=[IO.File]::ReadAllText($file)}}
          $codes=ConvertFrom-Json '{"BaselineOutputExists":"+lfafQVurlU4j/pR8l1YWyhXAjA=","BaselineTestsEmpty":"iVtoUSxuZooFbq5VunB6egIw","BaselineTestMissing":"iVtoUSxuZop6kDFZGv8=","BaselineGitFailed":"IXHVbNZTl19Icixnp2M2UoZPkG4Fbq5VAjA=","BaselineSourcesEmpty":"Y2sPXyAAUABvAHcAZQByAFMAaABlAGwAbAAgAIZPkG4Fbq5VunB6egIw"}'
          foreach($property in $codes.PSObject.Properties){$needle=[Text.Encoding]::Unicode.GetString([Convert]::FromBase64String($property.Value));if($privateText.Contains($needle)){Write-Host ('KNOWN_FAILURE='+$property.Name)}}
          foreach($location in [regex]::Matches($privateText,'(?<path>[A-Za-z]:[\\/][^\r\n]*?\.ps1)(?::(?:line\s*)?|,\s*line\s*)(?<line>[0-9]+)')){
            $full=$location.Groups['path'].Value
            if($full.StartsWith($source+'\',[StringComparison]::OrdinalIgnoreCase)){$relative=$full.Substring($source.Length+1).Replace('\','/');if($relative -in @('test/powershell/coverage/create_baseline_manifest.ps1','test/powershell/integration/audit_runtime_tests.ps1','test/powershell/coverage/safe_suite.ps1','script/test/powershell_coverage.ps1','core/audit_library.ps1')){Write-Host ('KNOWN_LOCATION '+(@{File=$relative;Line=[int]$location.Groups['line'].Value}|ConvertTo-Json -Compress))}}
          }
          Write-Host ('NativeExitCode='+$code+';CompletedEvidence='+(Test-Path (Join-Path $proof 'evidence.json')))
          & git diff --exit-code
          if($LASTEXITCODE -ne 0){throw 'Diagnostic changed tracked source'}
          exit $code