name: Windows 測試
on: workflow_dispatch
permissions:
  contents: read
jobs:
  native-prefix-probe:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: dc99d8e71fa1c02306b96316e14b3844d87bba84
          persist-credentials: false
      - name: Compare original native TEMP input with provider representation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $repo=$PWD.Path
          $fixture=Join-Path $env:TEMP ('coverage_alias_'+[guid]::NewGuid().ToString('N'))
          $leaf=[Text.Encoding]::Unicode.GetString([Convert]::FromBase64String('hk+QbiAALU6HZQ=='))
          $raw=Join-Path $fixture $leaf
          foreach($dir in @('core','test/powershell/unit','test/powershell/integration')){[void][IO.Directory]::CreateDirectory((Join-Path $raw $dir))}
          [IO.File]::WriteAllText((Join-Path $raw 'core/example.ps1'),'function Example {return 1}')
          [IO.File]::WriteAllText((Join-Path $raw 'test/powershell/unit/side_0_tests.ps1'),'# fixture')
          [IO.File]::WriteAllText((Join-Path $raw 'test/powershell/unit/side_1_tests.ps1'),'# fixture')
          & git -C $raw init --quiet
          & git -C $raw add .
          & git -C $raw -c user.name=CoverageFixture -c user.email=fixture@example.invalid commit --quiet -m fixture
          if($LASTEXITCODE){throw 'Cannot prepare isolated source'}
          $long=(Get-ChildItem -LiteralPath $fixture -Directory|Where-Object Name -ceq $leaf).FullName
          $inputs=@([pscustomobject]@{Kind='EnvTempInput';Path=$raw},[pscustomobject]@{Kind='DirectoryInfoInput';Path=$long})
          $codes=ConvertFrom-Json '{"BaselineTestMissing":"iVtoUSxuZop6kDFZGv8=","BaselineGitFailed":"IXHVbNZTl19Icixnp2M2UoZPkG4Fbq5VAjA=","BaselineOutputExists":"+lfafQVurlU4j/pR8l1YWyhXAjA="}'
          $i=0
          foreach($item in $inputs){
            $resolved=(Resolve-Path -LiteralPath $item.Path).Path
            foreach($entry in @(Get-ChildItem (Join-Path $resolved 'test/powershell/unit'),(Join-Path $resolved 'test/powershell/integration') -File -Filter '*_tests.ps1')){
              $relative=$entry.FullName.Substring($resolved.Length+1)
              Write-Host ('PATH_FACT '+(@{InputKind=$item.Kind;InputHasShortAlias=($item.Path -match '~[0-9]');ResolvedHasShortAlias=($resolved -match '~[0-9]');EntryHasShortAlias=($entry.FullName -match '~[0-9]');EntryPrefixMatches=$entry.FullName.StartsWith($resolved+'\',[StringComparison]::OrdinalIgnoreCase);RelativeExpected=($relative -match '^test[\\/]powershell[\\/]unit[\\/]side_[01]_tests\.ps1$');RelativeJoinExists=(Test-Path -LiteralPath (Join-Path $resolved $relative))}|ConvertTo-Json -Compress))
            }
            $i++;$success=$false;$classification='None';$exceptionType='None';$line=0
            try{& (Join-Path $repo 'test/powershell/coverage/create_baseline_manifest.ps1') -SourceRoot $item.Path -OutputPath (Join-Path $fixture ('manifest_'+$i+'.json'));$success=$true}catch{
              $exceptionType=$_.Exception.GetType().Name;$line=$_.InvocationInfo.ScriptLineNumber
              foreach($property in $codes.PSObject.Properties){$needle=[Text.Encoding]::Unicode.GetString([Convert]::FromBase64String($property.Value));if($_.Exception.Message.Contains($needle)){$classification=$property.Name}}
            }
            Write-Host ('BASELINE_FACT '+(@{InputKind=$item.Kind;Success=$success;FailureClassification=$classification;ExceptionType=$exceptionType;Line=$line}|ConvertTo-Json -Compress))
          }
          & git -C $repo diff --exit-code
          if($LASTEXITCODE){throw 'Probe changed original source'}