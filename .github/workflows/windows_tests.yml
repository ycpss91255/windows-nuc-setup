name: 原生 owner 單案例去識別診斷
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-owner-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9da438718c5e8e8e9345d0740db3b2567d68121f
          persist-credentials: false
      - name: 僅診斷原始137斷言的前置拒絕位置
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $sid=[Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $kind=if($sid -eq 'S-1-5-18'){'System'}elseif($sid -match '-500$'){'BuiltinAdministrator'}else{'StandardUser'}
          Write-Host ('NativeIdentityKind='+$kind+';Is64Bit='+[Environment]::Is64BitProcess)
          $path=Join-Path $PWD 'test/powershell/integration/native_process_owner_tests.ps1'
          $source=[IO.File]::ReadAllText($path)
          $needle=' Assert ($errorRecord -and ($errorRecord.Exception.Message'
          $insert=@'
           if($errorRecord){
            $message=$errorRecord.Exception.Message
            $reason=if($message -like '*Windows 流程不可在 SYSTEM*'){'ForbiddenNativeIdentity'}elseif($message -like '*缺少工具包檔案*'){'MissingPackageFile'}elseif($message -like '*目前登入桌面*'){'ExpectedOwnerBoundary'}elseif($message -like '*unexpected preflight*'){'UnexpectedMockRead'}else{'Other'}
            Microsoft.PowerShell.Utility\Write-Host ('@@DIAG@@'+(@{Case=$case.Name;Reason=$reason;Exception=$errorRecord.Exception.GetType().FullName;File=[IO.Path]::GetFileName($errorRecord.InvocationInfo.ScriptName);Line=$errorRecord.InvocationInfo.ScriptLineNumber}|ConvertTo-Json -Compress))
           }
          '@
          if(-not $source.Contains($needle)){throw 'Diagnostic insertion anchor missing'}
          $source=$source.Replace($needle,($insert+"`r`n"+$needle))
          [IO.File]::WriteAllText($path,$source,[Text.UTF8Encoding]::new($true))
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $path
          if($LASTEXITCODE -ne 0){throw 'Original unchanged assertion failed; diagnostic only, not a GREEN result.'}