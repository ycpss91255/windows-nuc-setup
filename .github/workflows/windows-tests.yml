name: Windows 測試

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得原始碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 執行 Windows PowerShell 5.1 隔離測試
        run: |
          & .\Tests\Run-CI.ps1 -ReportDirectory (Join-Path $env:RUNNER_TEMP 'NUC-CI-Results')
      - name: 測試報告短期保留七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/NUC-CI-Results/
          retention-days: 7
          if-no-files-found: warn
