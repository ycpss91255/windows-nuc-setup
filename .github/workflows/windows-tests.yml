name: Windows 測試

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  isolated-tests:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - name: 取得原始碼
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: 執行 Windows PowerShell 5.1 隔離測試
        run: |
          & .\script\test\Run-CI.ps1 -ReportDirectory (Join-Path $env:RUNNER_TEMP 'NUC-CI-Results')
      - name: 測試報告短期保留七天
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/NUC-CI-Results/
          retention-days: 7
          if-no-files-found: warn

  ci-rollup:
    name: ci-rollup
    if: always()
    needs: [isolated-tests]
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: 確認全部必要測試成功
        shell: pwsh
        env:
          TEST_RESULT: ${{ needs.isolated-tests.result }}
        run: |
          if ($env:TEST_RESULT -ne 'success') { throw '必要測試失敗、取消或跳過，不能合併或發布。' }

  release:
    name: 發布 GitHub 來源版本
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ci-rollup]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 取得完整已驗證歷史
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 驗證版本並產生當版說明
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          . .\script\release\Release.ps1
          Assert-ReleaseOnMain -PackageRoot $PWD.Path -Revision $env:SOURCE_COMMIT
          $release = .\script\release\Build-SourceRelease.ps1 -Version $env:RELEASE_TAG -Revision $env:SOURCE_COMMIT -OutputDirectory "$env:RUNNER_TEMP\release-notes"
          "prerelease=$($release.Prerelease.ToString().ToLowerInvariant())" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        id: release
      - name: 發布版本說明（使用 GitHub 內建來源壓縮檔）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          $arguments = @('release','create',$env:RELEASE_TAG,'--verify-tag','--title',"Windows 設定工具 $env:RELEASE_TAG",'--notes-file',"$env:RUNNER_TEMP\release-notes\RELEASE-NOTES.md")
          if ($env:IS_PRERELEASE -eq 'true') { $arguments += @('--prerelease','--latest=false') }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw '發布失敗；不覆寫既有版本。' }
